apiVersion: apps/v1
kind: Deployment
metadata:
  name: eren-api
  namespace: eren
  labels:
    app: eren-api
    version: v1
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eren-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: eren-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: eren-api
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: ghcr.io/orma-health/eren-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eren-secrets
                  key: database-url
                  optional: false
            - name: REDIS_URL
              value: redis://eren-redis:6379/0
            - name: QDRANT_URL
              value: http://eren-qdrant:6333
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: eren-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: eren-api
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: eren-api
---
apiVersion: v1
kind: Service
metadata:
  name: eren-api
  namespace: eren
  labels:
    app: eren-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: eren-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eren-api-hpa
  namespace: eren
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eren-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eren-api
  namespace: eren
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eren-api-pdb
  namespace: eren
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: eren-api
